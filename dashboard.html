<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RestoServe Dashboard</title>
<link rel="icon" href="LOGO-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1E2A38;--pine-2:#2A3848;--pine-line:#3B4A5E;--saffron:#F3A06C;--accent:#C2490F;--accent-dark:#9E3A0B;
    --paper:#FFFFFF;--sage:#F4F5F7;--ink:#1E2A38;--text:#5B6470;--line:#E6E8EC;--green:#1F7A4A;--green-soft:#E3F3EA;
    --red:#B42318;--red-soft:#FDECEA;--amber-soft:#FFF4E5;
    --display:'Gloock',Georgia,serif;--body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:var(--body);color:var(--text);background:var(--sage);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  h1,h2,h3{color:var(--ink);font-weight:600;line-height:1.2}
  button,select,textarea,input{font:inherit}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header.top{background:var(--pine);color:#C9D0DA}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none}
  .brand svg{flex:none}
  .who{display:flex;align-items:center;gap:14px;font-size:.95rem}
  .who b{color:#fff;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:1.5px solid var(--accent);border-radius:999px;padding:11px 24px;font-weight:600;cursor:pointer;min-height:44px;transition:background .2s;text-decoration:none}
  .btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;border-color:var(--pine-line);color:#E9ECF1}
  .btn.ghost:hover{background:var(--pine-2)}
  .btn.line{background:#fff;color:var(--ink);border-color:#C3C9D2}
  .btn.line:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.small{padding:7px 16px;min-height:38px;font-size:.92rem}

  /* Login / message screens */
  .center{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px}
  .login{width:min(460px,100%);padding:36px}
  .login h1{font-family:var(--display);font-weight:400;font-size:2rem;margin-bottom:8px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sage);border-radius:10px;padding:4px;margin:18px 0}
  .seg button{border:0;border-radius:7px;padding:9px;min-height:42px;background:transparent;color:var(--text);font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{display:block;font-weight:600;color:var(--ink);font-size:.92rem;margin:14px 0 6px}
  input[type=email],textarea,select{width:100%;border:1.5px solid #D5D9E0;border-radius:10px;padding:12px 14px;color:var(--ink);background:#fff}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .login .btn{width:100%;margin-top:18px}
  .note{font-size:.9rem;margin-top:14px}
  .msg{padding:12px 14px;border-radius:10px;font-size:.95rem;margin-top:14px}
  .msg.ok{background:var(--green-soft);color:var(--green)}
  .msg.err{background:var(--red-soft);color:var(--red)}

  /* Dashboard */
  main{padding:32px 0 64px}
  .bar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
  .bar h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3vw,2.3rem)}
  .bar .sub{font-size:.95rem;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .controls select{width:auto;min-width:220px;padding:9px 12px}
  .range{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .range button{border:0;background:transparent;border-radius:999px;padding:7px 16px;min-height:38px;font-weight:600;color:var(--text);cursor:pointer}
  .range button[aria-pressed="true"]{background:var(--pine);color:#fff}
  .views{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .views button{white-space:nowrap;flex:none}
  .views button{border:0;background:none;padding:10px 4px;margin-right:18px;font-weight:600;color:var(--text);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
  .views button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
  .tile .k{font-size:.9rem;font-weight:600}
  .tile .v{font-family:var(--display);font-size:2.4rem;color:var(--ink);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
  .tile .d{font-size:.85rem;margin-top:2px}
  .usage{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;margin-bottom:24px}
  .usage .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.95rem}
  .usage .row b{color:var(--ink)}
  .meter{height:10px;background:var(--sage);border-radius:99px;margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
  .meter i.warn{background:#D97706}.meter i.over{background:var(--red)}
  .grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .panel>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .panel>.hd h2{font-size:1.1rem}
  .panel>.hd span{font-size:.9rem}
  .empty{padding:28px 22px;font-size:.95rem}
  .list{list-style:none}
  .list>li{border-bottom:1px solid var(--line)}
  .list>li:last-child{border-bottom:0}
  .call{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 22px;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit}
  .call:hover{background:#FAFBFC}
  .call .t{font-weight:600;color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}
  .call .t small{display:block;font-weight:400;color:var(--text);font-size:.82rem}
  .call .s{font-size:.95rem;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .call .s small{display:block;color:var(--text);font-size:.85rem}
  .call .len{font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .detail{padding:0 22px 18px 122px}
  .detail audio{width:100%;max-width:520px;margin-bottom:10px}
  .detail .play{margin-bottom:10px}
  .transcript{white-space:pre-wrap;background:var(--sage);border-radius:10px;padding:14px;font-size:.9rem;max-height:320px;overflow:auto;color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:.94rem}
  th,td{padding:12px 22px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text);font-weight:700;background:#FAFBFC}
  td{color:var(--ink)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
  .pill.g{background:var(--green-soft);color:var(--green)}
  .pill.a{background:var(--amber-soft);color:#9A5B00}
  .pill.n{background:var(--sage);color:var(--text)}
  .pill.r{background:var(--red-soft);color:var(--red)}
  .deal{padding:20px 22px}
  .deal .stats{display:flex;gap:22px;margin-bottom:6px;flex-wrap:wrap}
  .deal .stats div{font-size:.88rem}
  .deal .stats b{display:block;font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--ink)}
  .deal textarea{resize:vertical;min-height:90px}
  .count{font-size:.82rem;text-align:right;margin-top:4px}
  .preview{background:var(--pine);color:#E9ECF1;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:.92rem;margin-top:12px}
  .preview small{display:block;color:var(--saffron);font-weight:700;font-size:.78rem;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
  .confirm{background:var(--amber-soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.93rem;color:#7A4A00}
  .confirm .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .recent{border-top:1px solid var(--line)}
  .recent li{padding:12px 22px;font-size:.92rem;color:var(--ink)}
  .recent li small{display:block;color:var(--text)}
  .loading{padding:28px 22px;color:var(--text)}
  .skel{display:inline-block;width:60px;height:1em;background:var(--sage);border-radius:6px;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.5}}
  .locked{display:flex;gap:10px;align-items:flex-start;background:var(--sage);border-radius:10px;padding:12px 14px;font-size:.9rem;margin-top:10px}
  .locked svg{flex:none;margin-top:2px}
  .upsell{padding:22px}
  .upsell h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin-bottom:6px}
  .upsell ul{list-style:none;margin:12px 0 18px}
  .upsell li{padding:4px 0 4px 24px;position:relative;font-size:.95rem;color:var(--ink)}
  .upsell li::before{content:"";position:absolute;left:3px;top:11px;width:10px;height:5px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#FAFBFC}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--text);background:var(--sage);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .mini{height:6px;background:var(--sage);border-radius:99px;margin-top:6px;overflow:hidden;min-width:90px}
  .mini i{display:block;height:100%;background:var(--green)}
  .mini i.warn{background:#D97706}.mini i.over{background:var(--red)}
  .pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line)}
  .pipe div{background:#fff;padding:16px 18px;font-size:.88rem}
  .pipe b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--ink)}
  @media (max-width:700px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .form{padding:22px;border-bottom:1px solid var(--line);background:#FCFCFD}
  .form h3{font-size:1.05rem;margin-bottom:4px}
  .fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
  .fgrid input[type=text],.fgrid input[type=email],.fgrid input[type=number]{width:100%;border:1.5px solid #D5D9E0;border-radius:10px;padding:10px 12px;color:var(--ink);background:#fff}
  .fgrid .wide{grid-column:1/-1}
  .fgrid small{display:block;font-size:.8rem;margin-top:3px}
  .checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
  .checks label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0;color:var(--ink)}
  .checks input{width:18px;height:18px;accent-color:var(--accent)}
  .facts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;background:var(--sage);border-radius:6px;padding:2px 6px;word-break:break-all}
  .rowacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:800px){.fgrid{grid-template-columns:1fr}}
  .msel{width:auto!important;min-width:150px;padding:8px 12px!important;border-radius:999px!important}
  .hdr{display:flex;align-items:center;gap:10px;font-size:.9rem}
  .modal-back{position:fixed;inset:0;background:rgba(30,42,56,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .pwcard{width:min(420px,100%)}
  .pwcard h2{font-family:var(--display);font-weight:400;font-size:1.6rem}
  .pwcard input,.login input[type=password]{width:100%;border:1.5px solid #D5D9E0;border-radius:10px;padding:12px 14px;color:var(--ink);background:#fff}
  .stack{display:flex;flex-direction:column;gap:24px;min-width:0}
  .grid2>*{min-width:0}
  td select{padding:6px 10px;width:auto}
  @media (max-width:900px){
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid2{grid-template-columns:1fr}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px}
    .who span{display:none}
    .tile{padding:16px}.tile .v{font-size:1.9rem}
    .call{grid-template-columns:66px minmax(0,1fr);padding:14px 16px}
    .call .len{grid-column:2}
    .detail{padding:0 16px 16px}
    th,td{padding:10px 8px}
    th:first-child,td:first-child{padding-left:16px}
    th:last-child,td:last-child{padding-right:16px}
    table{font-size:.86rem}
    .pill{padding:2px 7px;font-size:.76rem}
    .controls select{min-width:0;width:100%}
    .controls{width:100%}
    .panel>.hd{padding:16px}
    .deal{padding:16px}
    .panel>.hd span.hint{display:none}
    .hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="https://restoserve.ai">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#C2490F"/><g stroke="#fff" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="17" x2="12" y2="23"/><line x1="16.5" y1="13" x2="16.5" y2="27"/><line x1="21" y1="10" x2="21" y2="30"/><line x1="25.5" y1="14" x2="25.5" y2="26"/><line x1="30" y1="17.5" x2="30" y2="22.5"/></g></svg>
      RestoServe AI
    </a>
    <div class="who" id="who" hidden><span>Signed in as <b id="whoName"></b></span><button class="btn ghost small" id="pwSet" type="button">Password</button><button class="btn ghost small" id="logout" type="button">Log out</button></div>
  </div>
</header>

<div id="app"><div class="center"><p class="loading">Loading…</p></div></div>

<script>
const API = 'https://restoserve-server.onrender.com';
const app = document.getElementById('app');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let session = store.get('rs_session') || '';
let me = null, state = { view:'owner', loc:'', range: store.get('rs_range') || 'today' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const when = v => { const d = new Date(typeof v === 'number' ? v : v); return isNaN(d) ? '' : d; };
const tm = d => d ? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const dt = d => d ? d.toLocaleDateString([], {month:'short', day:'numeric'}) : '';
const mmss = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const has = (loc, f) => (loc.features || []).includes(f);
const lockIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const lockNote = (what, plan) => `<div class="locked">${lockIcon}<span>${what} are included from the <b>${plan}</b> plan. <a href="mailto:hello@restoserve.ai?subject=Upgrade%20my%20plan">Upgrade</a></span></div>`;
async function downloadCsv(loc, kind, btn){
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'Preparing…';
  try {
    const r = await fetch(`${API}/dash/export?loc=${encodeURIComponent(loc.key)}&range=${encodeURIComponent(state.range)}&kind=${kind}`, { headers: { 'Authorization': 'Bearer ' + session } });
    if (!r.ok) throw 0;
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = `${loc.key}-${kind}-${state.range}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e) { alertBox('Could not download the file. Please try again.'); }
  btn.disabled = false; btn.textContent = t;
}
const alertBox = m => { const d = document.createElement('div'); d.className = 'msg err'; d.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;z-index:9'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); };
const phone = p => { const d = String(p||'').replace(/\D/g,'').slice(-10); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p||'Unknown'); };

async function api(path, opts={}){
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session, ...(opts.headers||{}) } });
  if (r.status === 401) { signOut(true); throw new Error('signed out'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || 'Something went wrong. Please try again.');
  return j;
}

function signOut(expired){
  if (session && !expired) fetch(API + '/auth/logout', {method:'POST', headers:{'Authorization':'Bearer ' + session}}).catch(()=>{});
  session = ''; store.del('rs_session'); me = null;
  document.getElementById('who').hidden = true;
  showLogin(expired ? 'Please log in again.' : '');
}
document.getElementById('logout').addEventListener('click', () => signOut(false));

/* ---------- Login ---------- */
function showLogin(notice, role){
  role = role || (location.hash.includes('partner') ? 'partner' : 'owner');
  app.innerHTML = `
  <div class="center"><div class="card login">
    <h1>Log in</h1>
    <p>Use your password, or get a secure login link by email.</p>
    <div class="seg" role="group" aria-label="Account type">
      <button type="button" data-role="owner" aria-pressed="${role==='owner'}">Restaurant owner</button>
      <button type="button" data-role="partner" aria-pressed="${role==='partner'}">Sales partner</button>
    </div>
    <form id="loginForm" novalidate>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Leave empty to get an email link">
      <button class="btn" type="submit" id="pwBtn">Log in</button>
      <button class="btn line" type="button" id="linkBtn" style="width:100%;margin-top:10px">Email me a login link</button>
    </form>
    <div id="loginMsg">${notice ? `<div class="msg err">${esc(notice)}</div>` : ''}</div>
    <p class="note">No password yet, or forgot it? Use the email link, then set a password from your dashboard.</p>
    <p class="note">Not a customer yet? <a href="https://restoserve.ai/#start">Start a free trial</a></p>
  </div></div>`;
  app.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => {
    role = b.dataset.role; app.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  const em = app.querySelector('#em'), pw = app.querySelector('#pw'), msg = app.querySelector('#loginMsg');
  const validEmail = () => { if (/^\S+@\S+\.\S+$/.test(em.value.trim())) return true; msg.innerHTML = '<div class="msg err">Please enter a valid email address.</div>'; em.focus(); return false; };
  async function sendLink(){
    if (!validEmail()) return;
    const btn = app.querySelector('#linkBtn'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await fetch(API + '/website-form', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ form_type: role === 'partner' ? 'Partner portal login request' : 'Owner dashboard login request', Email: em.value.trim() }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw 0;
      app.querySelector('#loginForm').hidden = true;
      msg.innerHTML = '<div class="msg ok"><b>Check your email.</b> If this email is on a RestoServe account, your link is on its way. It works once and expires in 20 minutes.</div>';
    } catch(x) {
      msg.innerHTML = '<div class="msg err">We couldn’t send the link right now. Please try again, or email hello@restoserve.ai.</div>';
    } finally { btn.disabled = false; btn.textContent = 'Email me a login link'; }
  }
  app.querySelector('#linkBtn').addEventListener('click', sendLink);
  app.querySelector('#loginForm').addEventListener('submit', async e => {
    e.preventDefault(); msg.innerHTML = '';
    if (!pw.value) return sendLink();
    if (!validEmail()) return;
    const btn = app.querySelector('#pwBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
    try {
      const r = await fetch(API + '/auth/password-login', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: em.value.trim(), password: pw.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || 'Could not log in.');
      session = j.session; store.set('rs_session', session); start();
    } catch(x) { msg.innerHTML = `<div class="msg err">${esc(x.message === 'Failed to fetch' ? 'Can’t reach the server right now. Try again in a minute.' : x.message)}</div>`; pw.select(); }
    finally { btn.disabled = false; btn.textContent = 'Log in'; }
  });
}

function passwordPanel(){

}
document.getElementById('pwSet').addEventListener('click', () => passwordPanel());

/* ---------- Start ---------- */
async function start(){
  const m = location.hash.match(/[#&]t=([\w-]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname);
    app.innerHTML = '<div class="center"><p class="loading">Signing you in…</p></div>';
    try {
      const r = await fetch(API + '/auth/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: m[1] }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || 'This link didn’t work.');
      session = j.session; store.set('rs_session', session);
    } catch(e) { return showLogin(e.message); }
  }
  if (!session) return showLogin();
  try { me = await api('/dash/me'); } catch(e) { if (session) showLogin(e.message); return; }
  document.getElementById('whoName').textContent = me.name;
  document.getElementById('who').hidden = false;
  state.view = me.admin ? 'admin' : (me.owner && me.locations.length ? 'owner' : 'partner');
  const saved = store.get('rs_loc');
  state.loc = (me.locations.find(l => l.key === saved) || me.locations[0] || {}).key || '';
  render();
}

function render(){
  const views = [];
  if (me.admin) views.push(['admin','Overview'], ['customers','Customers']);
  if (me.owner && me.locations.length) views.push(['owner', me.admin ? 'Restaurants' : 'My restaurant']);
  if (me.partner) views.push(['partner', me.admin ? 'Leads and partners' : 'Partner portal']);
  app.innerHTML = `<main><div class="wrap">
    ${views.length > 1 ? `<div class="views" role="group" aria-label="Section">${views.map(([k,t]) => `<button type="button" data-view="${k}" aria-pressed="${state.view===k}">${t}</button>`).join('')}</div>` : ''}
    <div id="view"></div></div></main>`;
  app.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
  ({admin: adminView, customers: customersView, owner: ownerView, partner: partnerView})[state.view]();
}

async function loadOverview(q){
  const tiles = document.getElementById('tiles'), usage = document.getElementById('usage');
  try {
    const o = await api('/dash/overview' + q);
    const label = {today:'today','7d':'last 7 days',month:'this month'}[o.range] || o.month_label;
    tiles.innerHTML = [
      ['Calls answered', num(o.calls), o.calls == null ? 'Call history not connected yet' : label],
      ['Minutes used', num(o.minutes), o.minutes == null ? '' : label],
      ['Orders placed', num(o.orders), label],
      ['Order sales', money(o.sales), 'before pickup changes']
    ].map(([k,val,d]) => `<div class="tile"><div class="k">${k}</div><div class="v">${val}</div><div class="d">${esc(d)}</div></div>`).join('');
    if (o.plan_minutes && o.month_minutes != null) {
      const pct = Math.min(100, Math.round(o.month_minutes / o.plan_minutes * 100));
      usage.hidden = false;
      usage.innerHTML = `<div class="row"><span><b>${num(o.month_minutes)}</b> of ${num(o.plan_minutes)} plan minutes used ${o.past ? 'in ' + esc(o.month_label) : 'this month'}</span><span>${pct >= 100 ? 'Extra minutes are $0.45 each' : num(o.plan_minutes - o.month_minutes) + ' left'}</span></div>
        <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Plan minutes used"><i class="${pct>=100?'over':pct>=80?'warn':''}" style="width:${pct}%"></i></div>`;
    }
  } catch(e) { tiles.innerHTML = `<div class="tile" style="grid-column:1/-1"><div class="k">${esc(e.message)}</div></div>`; }
}

async function loadCalls(q, loc){
  const box = document.getElementById('calls');
  try {
    const { calls } = await api('/dash/calls' + q);
    if (!calls.length) { box.innerHTML = '<p class="empty">No calls in this period yet.</p>'; return; }
    box.innerHTML = '<ul class="list">' + calls.map((c,i) => { const d = when(c.start); return `<li>
      <button class="call" type="button" aria-expanded="false" data-i="${i}">
        <span class="t">${tm(d)}<small>${dt(d)}</small></span>
        <span class="s">${esc(c.summary || 'No summary for this call')}<small>${esc(phone(c.from))}</small></span>
        <span class="len">${mmss(c.seconds)}</span>
      </button><div class="detail" hidden></div></li>`; }).join('') + '</ul>';
    box.querySelectorAll('.call').forEach(b => b.addEventListener('click', () => {
      const c = calls[b.dataset.i], det = b.nextElementSibling, open = det.hidden;

      if (open && !det.innerHTML) {
        const locks = (has(loc,'recordings') ? '' : lockNote('Call recordings', 'Standard')) + (has(loc,'transcripts') ? '' : lockNote('Full transcripts', 'Starter'));

        api(`/dash/call?loc=${encodeURIComponent(loc.key)}&call_id=${encodeURIComponent(c.id)}`).then(r => {

        return `<tr class="click" data-loc="${esc(r.key)}" tabindex="0"><td><b>${esc(r.name)}</b>${r.internal ? '<span class="tag">Test</span>' : ''}<br><small>${esc(r.company || 'No owner login yet')}</small></td>
        <td>${esc(r.plan)}${r.flash_addon ? '<span class="tag">+ Deals</span>' : ''}<br><small>${r.internal ? 'not counted' : money(r.price).replace('.00','') + '/mo'}</small></td>
        <td>${r.minutes == null ? '<small>Not connected</small>' : `${num(r.minutes)} / ${num(r.plan_minutes)}${r.overage_minutes ? ` <span class="pill r">+${num(r.overage_minutes)}</span>` : ''}<div class="mini"><i class="${pct>=100?'over':pct>=80?'warn':''}" style="width:${pct}%"></i></div>`}</td>
        <td class="num">${num(r.calls)}</td><td class="num">${num(r.today_calls)}</td><td class="num">${num(r.orders)}</td><td class="num">${money(r.sales)}</td></tr>`; }).join('') + '</tbody></table></div>';
    document.querySelectorAll('tr[data-loc]').forEach(tr => { const go = () => { state.loc = tr.dataset.loc; store.set('rs_loc', state.loc); state.view = 'owner'; render(); };
      tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
    document.getElementById('apipe').innerHTML = '<div class="pipe">' + Object.entries(d.pipeline).map(([k,n]) => `<div><b>${num(n)}</b>${esc(k)}</div>`).join('') + '</div>';
    document.getElementById('owed').textContent = d.owed ? money(d.owed).replace('.00','') + ' owed to partners' : '';
  } catch(e) { document.getElementById('arows').innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

/* ---------- Admin: customers page ---------- */
const TZS = [['America/Denver','Mountain (NM, CO)'],['America/Phoenix','Arizona'],['America/Chicago','Central'],['America/New_York','Eastern'],['America/Los_Angeles','Pacific']];
const SERVER = API;
async function customersView(msg){
  const v = document.getElementById('view');
  v.innerHTML = `<div class="bar"><div><h1>Customers</h1><p class="sub">Add restaurants and logins here. Changes work right away, with no server restart.</p></div>
    <div class="controls"><button class="btn line small" id="syncAll" type="button">Import calls from Retell</button><button class="btn line small" id="ordAll" type="button">Import orders from Square</button><button class="btn line small" id="report" type="button">Email last month's billing report</button></div></div>
    <div id="cmsg">${msg ? `<div class="msg ok" style="margin:0 0 16px">${esc(msg)}</div>` : ''}</div>
    <section class="panel" style="margin-bottom:24px"><div class="hd"><h2>Restaurants</h2><button class="btn small" id="addRest" type="button">Add restaurant</button></div><div id="restForm"></div><div id="restList"><p class="loading">Loading…</p></div></section>
    <section class="panel"><div class="hd"><h2>Logins</h2><button class="btn small" id="addAcc" type="button">Add login</button></div><div id="accForm"></div><div id="accList"><p class="loading">Loading…</p></div></section>`;
  let d;
  try { d = await api('/dash/admin/customers'); } catch(e) { v.querySelector('#restList').innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  const names = Object.fromEntries(d.restaurants.map(r => [r.key, r.name]));
  v.querySelector('#restList').innerHTML = d.restaurants.length ? `<div class="scroll"><table><thead><tr><th>Restaurant</th><th>Plan</th><th>Order emails go to</th><th>Retell agent</th><th>Phone setup</th><th></th></tr></thead><tbody>` +
    d.restaurants.map((r,i) => `<tr><td><b>${esc(r.name)}</b>${r.internal ? '<span class="tag">Test</span>' : ''}<br><small>${esc(r.key)}</small></td>
      <td>${esc(r.plan)}${r.flash_deals ? '<span class="tag">+ Deals</span>' : ''}${r.minutes ? `<br><small>${num(r.minutes)} min</small>` : ''}</td>
      <td>${r.alert_emails ? esc(r.alert_emails) : '<small>You (not set yet)</small>'}</td>
      <td>${r.agent_id ? `<span class="code">${esc(r.agent_id)}</span>` : '<span class="pill a">Not connected</span>'}</td>
      <td>${r.phone_ready ? `<small>Function URLs end with</small> <span class="code">?loc=${esc(r.key)}</span>` : '<span class="pill a">Needs Square location ID</span>'}</td>
      <td><div class="rowacts"><button class="btn line small" data-edit-rest="${i}" type="button">Edit</button><button class="btn line small" data-sync="${esc(r.key)}" type="button">Import calls</button></div></td></tr>`).join('') +
    '</tbody></table></div>' : '<p class="empty">No restaurants yet.</p>';
  v.querySelector('#accList').innerHTML = d.accounts.length || d.admins.length ? `<div class="scroll"><table><thead><tr><th>Email</th><th>Type</th><th>Company / code</th><th>Restaurants</th><th></th></tr></thead><tbody>` +
    d.admins.map(e => `<tr><td>${esc(e)}</td><td><span class="pill g">Admin</span></td><td><small>Set in Render (ADMIN_EMAILS)</small></td><td><small>All</small></td><td></td></tr>`).join('') +
    d.accounts.map((a,i) => `<tr><td>${esc(a.email)}<br><small>${esc(a.name)}</small></td>
      <td><span class="pill ${a.active ? (a.role==='partner'?'a':'g') : 'r'}">${a.active ? ({owner:'Owner',partner:'Partner',admin:'Admin'})[a.role] : 'Turned off'}</span></td>
      <td>${esc(a.role === 'partner' ? (a.code ? 'Code: ' + a.code : '') : a.company)}</td>
      <td>${a.role === 'owner' ? a.locations.map(l => esc(names[l] || l)).join(', ') : '<small>–</small>'}</td>
      <td><div class="rowacts"><button class="btn line small" data-edit-acc="${i}" type="button">Edit</button></div></td></tr>`).join('') +
    '</tbody></table></div>' : '<p class="empty">No logins yet.</p>';

  const show = (id, html) => { const box = v.querySelector(id); box.innerHTML = html; box.scrollIntoView({block:'nearest'}); return box; };
  const err = (box, m) => { let e = box.querySelector('.ferr'); e.innerHTML = `<div class="msg err">${esc(m)}</div>`; };

  function restForm(r){
    const isNew = !r; r = r || {plan:'Standard', tz:'America/Denver'};
    const box = show('#restForm', `<form class="form" novalidate><h3>${isNew ? 'Add a restaurant' : 'Edit ' + esc(r.name)}</h3>
      <div class="fgrid">
        <div><label for="rf_name">Restaurant name</label><input type="text" id="rf_name" value="${esc(r.name||'')}" placeholder="Taj Palace"></div>
        <div><label for="rf_key">Short name</label><input type="text" id="rf_key" value="${esc(r.key||'')}" ${isNew?'':'readonly'} placeholder="taj-palace"><small>Used in the Retell links. Can't change later.</small></div>
        <div><label for="rf_plan">Plan</label><select id="rf_plan">${d.plans.map(p => `<option ${p===r.plan?'selected':''}>${p}</option>`).join('')}</select></div>
        <div><label for="rf_agent">Retell agent ID</label><input type="text" id="rf_agent" value="${esc(r.agent_id||'')}" placeholder="agent_..."><small>Calls, minutes and recordings come from this agent.</small></div>
        <div><label for="rf_sq">Square location ID</label><input type="text" id="rf_sq" value="${esc(r.square_location_id||'')}" placeholder="L08M50SDF51R6"><small>Where phone orders go.</small></div>
        <div><label for="rf_tz">Time zone</label><select id="rf_tz">${TZS.map(([k,t]) => `<option value="${k}" ${k===(r.tz||'America/Denver')?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label for="rf_min">Custom minutes (optional)</label><input type="number" id="rf_min" min="0" value="${esc(r.minutes||'')}" placeholder="Plan default"></div>
        <div class="wide"><label for="rf_em">Order and alert emails</label><input type="text" id="rf_em" value="${esc(r.alert_emails||'')}" placeholder="owner@gmail.com, manager@gmail.com"><small>Phone orders, catering, complaints and payment alerts for this restaurant go here (up to 5, separated by commas). Leave empty and they come to you.</small></div>
        <div class="wide"><div class="checks"><label><input type="checkbox" id="rf_copy" ${r.copy_admin!==false?'checked':''}> Send me a hidden copy</label><label><input type="checkbox" id="rf_deals" ${r.flash_deals?'checked':''}> Flash Deals add-on ($49/mo)</label><label><input type="checkbox" id="rf_int" ${r.internal?'checked':''}> Test restaurant (don't count as revenue)</label></div></div>
      </div><div class="ferr"></div>
      <div class="facts"><button class="btn small" type="submit">Save restaurant</button><button class="btn line small" type="button" data-cancel>Cancel</button></div></form>`);
    if (isNew) { const n = box.querySelector('#rf_name'), k = box.querySelector('#rf_key'); n.addEventListener('input', () => { if (!k.dataset.touched) k.value = n.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40); }); k.addEventListener('input', () => k.dataset.touched = 1); }
    box.querySelector('[data-cancel]').addEventListener('click', () => box.innerHTML = '');
    box.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); const b = e.target.querySelector('[type=submit]'); b.disabled = true;
      try {
        await api('/dash/admin/restaurant', { method:'POST', body: JSON.stringify({ key: box.querySelector('#rf_key').value.trim(), name: box.querySelector('#rf_name').value,
          plan: box.querySelector('#rf_plan').value, agent_id: box.querySelector('#rf_agent').value, square_location_id: box.querySelector('#rf_sq').value,
          tz: box.querySelector('#rf_tz').value, minutes: box.querySelector('#rf_min').value, flash_deals: box.querySelector('#rf_deals').checked, internal: box.querySelector('#rf_int').checked,
          alert_emails: box.querySelector('#rf_em').value, copy_admin: box.querySelector('#rf_copy').checked }) });
        me = await api('/dash/me'); customersView('Restaurant saved.');
      } catch(x) { b.disabled = false; err(box, x.message); }
    });
  }

  function accForm(a){
    const isNew = !a; a = a || {role:'owner', locations:[], active:1};
    const box = show('#accForm', `<form class="form" novalidate><h3>${isNew ? 'Add a login' : 'Edit ' + esc(a.email)}</h3>
      <div class="fgrid">
        <div><label for="af_email">Email</label><input type="email" id="af_email" value="${esc(a.email||'')}" ${isNew?'':'readonly'}></div>
        <div><label for="af_role">Type</label><select id="af_role"><option value="owner" ${a.role==='owner'?'selected':''}>Restaurant owner</option><option value="partner" ${a.role==='partner'?'selected':''}>Sales partner</option><option value="admin" ${a.role==='admin'?'selected':''}>Admin (sees everything)</option></select></div>
        <div><label for="af_name">Person's name</label><input type="text" id="af_name" value="${esc(a.name||'')}"></div>
        <div data-for="owner"><label for="af_co">Company</label><input type="text" id="af_co" value="${esc(a.company||'')}" placeholder="Khansons LLC"><small>Locations with the same company count as one customer.</small></div>
        <div data-for="partner"><label for="af_code">Referral code</label><input type="text" id="af_code" value="${esc(a.code||'')}" placeholder="Sara"><small>What owners type in "Referred by".</small></div>
        <div class="wide" data-for="owner"><label>Restaurants they can see</label><div class="checks">${d.restaurants.map(r => `<label><input type="checkbox" value="${esc(r.key)}" class="af_loc" ${a.locations.includes(r.key)?'checked':''}> ${esc(r.name)}</label>`).join('')}</div></div>
        <div class="wide"><div class="checks"><label><input type="checkbox" id="af_active" ${a.active?'checked':''}> Login is on</label></div></div>
      </div><div class="ferr"></div>
      <div class="facts"><button class="btn small" type="submit">Save login</button><button class="btn line small" type="button" data-cancel>Cancel</button></div></form>`);
    const role = box.querySelector('#af_role');
    const toggle = () => box.querySelectorAll('[data-for]').forEach(el => el.hidden = el.dataset.for !== role.value);
    role.addEventListener('change', toggle); toggle();
    box.querySelector('[data-cancel]').addEventListener('click', () => box.innerHTML = '');
    box.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); const b = e.target.querySelector('[type=submit]'); b.disabled = true;
      try {
        await api('/dash/admin/account', { method:'POST', body: JSON.stringify({ email: box.querySelector('#af_email').value, role: role.value,
          name: box.querySelector('#af_name').value, company: box.querySelector('#af_co').value, code: box.querySelector('#af_code').value,
          locations: [...box.querySelectorAll('.af_loc:checked')].map(c => c.value), active: box.querySelector('#af_active').checked }) });
        customersView(isNew ? 'Login saved. They can now log in on restoserve.ai with this email.' : 'Login saved.');
      } catch(x) { b.disabled = false; err(box, x.message); }
    });
  }

  v.querySelector('#addRest').addEventListener('click', () => restForm());
  v.querySelector('#addAcc').addEventListener('click', () => accForm());
  v.querySelectorAll('[data-edit-rest]').forEach(b => b.addEventListener('click', () => restForm(d.restaurants[b.dataset.editRest])));
  v.querySelectorAll('[data-edit-acc]').forEach(b => b.addEventListener('click', () => accForm(d.accounts[b.dataset.editAcc])));
  const sync = async (btn, loc) => {
    btn.disabled = true; const t = btn.textContent; btn.textContent = 'Importing…';
    try { const r = await api('/dash/admin/sync', { method:'POST', body: JSON.stringify(loc ? {loc} : {}) });
      const n = Object.values(r.imported).reduce((a,b) => a+b, 0);
      const errs = Object.entries(r.errors || {}).map(([k,m]) => `${esc(names[k] || k)}: ${esc(m)}`);
      const nc = (r.not_connected || []).map(k => esc(names[k] || k));
      v.querySelector('#cmsg').innerHTML = `<div class="msg ${errs.length ? 'err' : 'ok'}" style="margin:0 0 16px">Imported ${num(n)} calls from the last 90 days.` +
        (nc.length ? ` No Retell agent ID yet: ${nc.join(', ')}.` : '') + (errs.length ? `<br>Problem: ${errs.join('<br>')}` : '') + '</div>';
    } catch(e) { v.querySelector('#cmsg').innerHTML = `<div class="msg err" style="margin:0 0 16px">${esc(e.message)}</div>`; }
    btn.disabled = false; btn.textContent = t;
  };
  v.querySelector('#syncAll').addEventListener('click', e => sync(e.target));
  v.querySelector('#ordAll').addEventListener('click', async e => {
    const btn = e.target; btn.disabled = true; const t = btn.textContent; btn.textContent = 'Importing…';
    try { const r = await api('/dash/admin/import-orders', { method:'POST', body: '{}' });
      const n = Object.values(r.imported).reduce((a,b) => a+b, 0);
      const errs = Object.entries(r.errors || {}).map(([k,m]) => `${esc(names[k] || k)}: ${esc(m)}`);
      v.querySelector('#cmsg').innerHTML = `<div class="msg ${errs.length ? 'err' : 'ok'}" style="margin:0 0 16px">Imported ${num(n)} phone orders from the last 90 days.` + (errs.length ? `<br>Problem: ${errs.join('<br>')}` : '') + '</div>';
    } catch(x) { v.querySelector('#cmsg').innerHTML = `<div class="msg err" style="margin:0 0 16px">${esc(x.message)}</div>`; }
    btn.disabled = false; btn.textContent = t;
  });
  v.querySelector('#report').addEventListener('click', async e => {
    const btn = e.target; btn.disabled = true;
    try { const r = await api('/dash/admin/report', { method:'POST', body: '{}' }); v.querySelector('#cmsg').innerHTML = `<div class="msg ok" style="margin:0 0 16px">${esc(r.message)}</div>`; }
    catch(x) { v.querySelector('#cmsg').innerHTML = `<div class="msg err" style="margin:0 0 16px">${esc(x.message)}</div>`; }
    btn.disabled = false;
  });
  v.querySelectorAll('[data-sync]').forEach(b => b.addEventListener('click', () => sync(b, b.dataset.sync)));
}

start();
</script>
